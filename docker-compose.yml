# =============================================================================
#  Zero to Production — full stack, one command:  docker compose up -d --build
#
#  Services you wrote:      api, worker, web
#  Services off the shelf:  traefik, postgres, redis
#
#  PORTS: all host ports come from .env so this can run on a VPS that already
#  has sites on :80/:443 without colliding. See .env.example.
# =============================================================================

name: ${PROJECT_NAME:-z2p}

services:
  # ---------------------------------------------------------------------------
  # Edge: TLS termination, routing, and LOAD BALANCING across api replicas.
  # Auto-discovers containers via docker labels — no config file to maintain.
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
      # Uncomment for real TLS once a domain points here:
      # - --entrypoints.websecure.address=:443
      # - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      # - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [edge, internal]

  # ---------------------------------------------------------------------------
  # API — stateless. This is what scales:  docker compose up -d --scale api=3
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./services/api
      target: runtime
    # api, worker, migrate and seed share ONE image. Compose builds it once,
    # and every process is guaranteed to be running identical bytes.
    image: ${PROJECT_NAME:-z2p}-app:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/ready`) || PathPrefix(`/metrics`) || PathPrefix(`/docs`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=3000
      # Pull unhealthy replicas out of rotation automatically:
      - traefik.http.services.api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.api.loadbalancer.healthcheck.interval=10s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [edge, internal]

  # ---------------------------------------------------------------------------
  # Worker — SAME IMAGE as api, different entrypoint.
  # This is the sync/async seam. One build, one test suite, two scaling profiles.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./services/api
      target: runtime
    image: ${PROJECT_NAME:-z2p}-app:latest
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    # The worker shares the API's image, which carries an HTTP HEALTHCHECK — but
    # the worker serves no HTTP, so that check would always fail. Disable it
    # rather than fake an endpoint just to satisfy a probe.
    # Upgrade path: have the worker write a heartbeat key to Redis each loop and
    # check that instead. Worth mentioning if the panel asks about observability.
    healthcheck:
      disable: true
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Web — React built to static, served by nginx. No Node in production.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1          # lower than api, so /api wins
      - traefik.http.services.web.loadbalancer.server.port=80
    networks: [edge]

  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # BOUND TO LOOPBACK ONLY — deliberately.
      # Docker publishes ports by inserting iptables rules in the DOCKER chain,
      # which is traversed BEFORE ufw's. A bare "55432:5432" therefore binds
      # 0.0.0.0 and is reachable from the internet even when ufw denies it.
      # This mapping exists purely so you can run psql from the host.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Migrations — runs to completion, then exits. Migrations are NOT run on boot
  # by the app; that's a deliberate decision judges like.
  #   docker compose run --rm migrate
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./services/api
      target: runtime
    image: ${PROJECT_NAME:-z2p}-app:latest
    command: ["node", "dist/db/migrate.js"]
    env_file: [.env]
    environment:
      # NOTE: `environment:` beats `env_file:`. This must be set explicitly or
      # NODE_ENV=development from .env wins over the Dockerfile's ENV and the
      # logger tries to load pino-pretty, which is a devDependency absent from
      # the production image.
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Migrations don't touch Redis, but env validation is all-or-nothing by
      # design — the app refuses to boot on partial config rather than fail
      # later at request time.
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [tools]
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Demo data. Run AFTER migrate:  docker compose run --rm seed
  # A judge who opens your live URL should never see an empty screen.
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: ./services/api
      target: runtime
    image: ${PROJECT_NAME:-z2p}-app:latest
    command: ["node", "dist/db/seed.js"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [tools]
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  letsencrypt:

networks:
  edge:      # public-facing
  internal:  # postgres/redis are NOT reachable from outside
