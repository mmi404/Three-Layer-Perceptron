# =============================================================================
#  Nginx reverse proxy — replaces Traefik.
#
#  Routes:
#    /api/*  /health  /ready  /metrics  →  api:3000
#    everything else                     →  web:80  (SPA)
#
#  Why Nginx instead of Traefik:
#    Traefik v3.x pins Docker API version 1.24 in its Go client. Docker Engine
#    28+ dropped support for API < 1.40, so Traefik can never discover backends
#    via the Docker socket. Nginx uses static upstreams — no socket needed.
# =============================================================================

upstream api_backend {
    server api:3000;
    keepalive 16;
}

upstream web_backend {
    server web:80;
}

server {
    listen 80;
    server_name _;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API routes ---
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location = /ready {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location = /metrics {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # --- SPA frontend (catch-all) ---
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
