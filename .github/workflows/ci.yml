name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Change-aware: skip work that cannot be affected by the diff.
  # A docs-only commit should not spend four minutes rebuilding two images.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
            web:
              - 'web/**'
            infra:
              - 'docker-compose*.yml'
              - 'deploy.sh'
              - '.github/workflows/**'
              - 'infra/**'

  # ---------------------------------------------------------------------------
  # Lint, typecheck and test against REAL Postgres and Redis.
  #
  # The concurrency suite is the core of this project's correctness argument and
  # it rests entirely on Postgres row locks, so mocking the database here would
  # verify nothing at all.
  # ---------------------------------------------------------------------------
  test:
    name: Lint - Typecheck - Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.infra == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: cinemaseat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d cinemaseat"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://app:app@localhost:5432/cinemaseat
      REDIS_URL: redis://localhost:6379
      HOLD_TTL_SECONDS: 120

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply migrations
        run: npm run migrate
      - name: Unit and concurrency tests
        run: npm test

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Prove the images build on a clean machine, then boot the WHOLE stack and
  # exercise it. This is the job that backs the "docker compose up works from a
  # clean clone" claim, so it deliberately creates no .env file.
  # ---------------------------------------------------------------------------
  stack:
    name: Stack smoke test
    runs-on: ubuntu-latest
    needs: [test, web-build]
    # `always()` so a skipped (not failed) upstream job does not block this.
    if: always() && !contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@v4

      - name: Bring the whole stack up from a clean clone
        run: |
          export BUILD_SHA=$(git rev-parse --short HEAD)
          docker compose up -d --build

      - name: Migrations and seed ran automatically
        run: |
          docker compose wait seed || true
          docker compose ps -a
          test "$(docker compose ps -a --status exited --format '{{.Name}} {{.ExitCode}}' | grep -c ' 0$')" -ge 2

      - name: Health, readiness and provenance
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "Traefik routed to healthy API backend on attempt $i"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health
          echo
          curl -fsS http://localhost:8080/ready
          echo
          test "$(curl -fsS http://localhost:8080/health | grep -o '"version":"[^"]*"')" \
             = "\"version\":\"$(git rev-parse --short HEAD)\""

      - name: Seat map and catalog respond
        run: |
          set -e
          ST=$(curl -fsS http://localhost:8080/api/v1/movies \
               | python3 -c "import sys,json;print(json.load(sys.stdin)['data'][0]['showtimes'][0]['id'])")
          curl -fsS "http://localhost:8080/api/v1/showtimes/$ST/seats" > /dev/null
          echo "seat map OK for showtime $ST"

      - name: Scenario A - zero oversell under 100 concurrent holds
        run: python3 loadtest/scenario-a.py http://localhost:8080 100

      - name: Fault isolation - gateway stopped
        run: bash loadtest/fault-isolation.sh http://localhost:8080

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # CD — only on the default branch, only after everything above is green.
  # Nothing merges without CI; nothing deploys without a merge.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [stack]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
        run: |
          set -e
          printf '%s\n' "$DEPLOY_KEY" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              '
                sudo usermod -aG docker "$USER" 2>/dev/null || true
                sudo chmod 666 /var/run/docker.sock 2>/dev/null || true
                mkdir -p ~/apps
                if [ ! -d ~/apps/cinemaseat/.git ]; then
                  git clone https://github.com/mmi404/Three-Layer-Perceptron.git ~/apps/cinemaseat
                  cd ~/apps/cinemaseat
                  bash infra/ec2-setup.sh https://github.com/mmi404/Three-Layer-Perceptron.git
                else
                  cd ~/apps/cinemaseat
                  git fetch origin main
                  git reset --hard origin/main
                  chmod +x deploy.sh
                  ./deploy.sh
                fi
              '

      - name: Verify the public URL is serving this commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          # Give Traefik time to register routes after deploy
          for i in $(seq 1 15); do
            LIVE=$(curl -fsS --max-time 10 "http://$DEPLOY_HOST/health" 2>/dev/null || echo "")
            if echo "$LIVE" | grep -q "\"version\":\"$SHA\""; then
              echo "$LIVE"
              echo "Deployed $SHA and confirmed live."
              exit 0
            fi
            echo "  attempt $i: waiting for $SHA on $DEPLOY_HOST..."
            sleep 5
          done
          echo "FAILED: could not verify $SHA on http://$DEPLOY_HOST/health"
          curl -sS "http://$DEPLOY_HOST/health" || true
          exit 1
